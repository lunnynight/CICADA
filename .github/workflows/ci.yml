name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - DEV

jobs:
  flutter:
    name: Flutter Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare bundled dependencies
        run: |
          dart scripts/prepare_bundled_deps.dart || echo "Warning: Failed to prepare bundled deps"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
